name: Update Short-Term Ranges

on:
  schedule:
    - cron: '4,19,34,49 * * * *'   # odd minutes: GitHub drops/delays scheduled runs at :00/:15/:30/:45 (peak load)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: short-range-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy yfinance
      - run: python short_range_updater.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add short_range_latest.json short_range_track_record.json
          git commit -m "Update short-term ranges" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || (sleep 5 && git pull --rebase origin main && git push)
