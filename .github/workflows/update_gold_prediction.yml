name: Update Gold Prediction

# Runs on a schedule, entirely on GitHub's own free infrastructure.
#
# HISTORY: tried GoldAPI.io (100/month, safe cap: every 8 hours), then
# Binance (blocked from GitHub Actions with HTTP 451, reverted), now on
# GoldPriceZ.com (60 requests/hour, confirmed directly by their support
# team). Hourly uses just 1 of the 60 allowed per hour -- comfortable
# margin, and more frequent than hourly doesn't add much real value for
# a next-day-style prediction anyway.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn scipy requests yfinance

      - name: Run prediction updater
        env:
          GOLDPRICEZ_API_KEY: ${{ secrets.GOLDPRICEZ_API_KEY }}
        run: python gold_predictor_updater.py

      # BACKUP TRIGGER for the short-term ranges: GitHub often skips the 15-minute schedule of the
      # "Update Short-Term Ranges" workflow, but this hourly job has been reliable. Running the
      # range updater here as well guarantees at least an hourly refresh (and scoring of past ranges).
      # continue-on-error: a ranges problem must never block the gold update.
      - name: Refresh short-term ranges (backup trigger)
        continue-on-error: true
        run: python short_range_updater.py

      - name: Commit and push updated prediction data
        run: |
          git config user.name "gold-predictor-bot"
          git config user.email "actions@github.com"
          git add gold_prediction_latest.json gold_price_history.json prediction_track_record.json
          git add short_range_latest.json short_range_track_record.json calibration_state.json 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update gold prediction data [automated]"

          # FIXED same session as the news-sentiment fix: gold runs
          # HOURLY, the most frequent of all these bots, so it's
          # actually the most likely one to collide with the others --
          # same retry-with-rebase fix, safe since this bot only
          # touches its own 3 gold_*.json/prediction_track_record.json
          # files.
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i/5) -- pulling latest changes and retrying..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
