name: Record Live Gold Ticks

# Starts hourly (GitHub may skip some starts -- gaps are fine), then records the live gold price every 2 minutes
# for ~52 minutes. Public repo = free minutes.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-ticks
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Record ticks
        env:
          GOLDPRICEZ_API_KEY: ${{ secrets.GOLDPRICEZ_API_KEY }}
        run: python live_tick_recorder.py
