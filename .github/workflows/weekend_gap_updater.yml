name: Update Weekend Gap Stats

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: python weekend_gap_updater.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add weekend_gap.json
          git commit -m "Update weekend gap stats" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || (sleep 5 && git pull --rebase origin main && git push)
