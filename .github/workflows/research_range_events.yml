name: Research - Range Events

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy requests yfinance
      - run: python research_range_events.py selftest
      - run: python research_range_events.py
      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add research_range_events_report.json
          git commit -m "Add range-at-events research report" || echo "nothing to commit"
          git push
