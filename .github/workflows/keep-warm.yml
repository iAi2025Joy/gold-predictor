name: Keep Backend Warm

# Render's free tier spins a service down after ~15 minutes with no
# incoming traffic, and the next real request then has to wait through
# a 50+ second "cold start" while it spins back up -- this is the
# confirmed cause of the intermittent "Connection error" seen in
# testing (retrying the exact same request right after always
# succeeded instantly, which only makes sense for a cold-start delay,
# not a real code bug). Pinging more often than that 15-minute window
# keeps the service permanently warm, so real user requests basically
# never hit a cold start.
#
# Genuinely free: GitHub Actions gives generous free minutes, and this
# job runs for a few seconds every 10 minutes -- nowhere near any
# usage limit, and doesn't require upgrading Render off the free plan.

on:
  schedule:
    # Every 10 minutes -- comfortably inside Render's ~15-minute
    # inactivity window, with margin for GitHub's own scheduling delay
    # (GitHub does not guarantee cron jobs run at the exact minute,
    # especially under high platform load).
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab, e.g. to test it immediately

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          curl -sS --max-time 30 https://ai-chat-backend-3-g573.onrender.com/ || echo "Ping failed (backend may have been mid-restart) -- not treated as a workflow failure, next scheduled ping will retry naturally."
